name: Deploy to CloudPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Syntax check
        run: |
          node --check server.js
          for f in js/*.js; do node --input-type=module --check < "$f"; done

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS secret not set; trusting the host key found by ssh-keyscan."
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<CFG
          Host cloudpanel
            HostName $SSH_HOST
            Port $SSH_PORT
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          CFG

      - name: Upload files
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # --delete keeps the server in sync, but never touches the leaderboard data or server-side .env.
          # No -a: the site root is owned by CloudPanel, so we must not try to set its times/perms/owner.
          rsync -rlz --times --omit-dir-times --no-perms --no-owner --no-group --delete \
            --exclude '.git/' --exclude '.github/' --exclude 'node_modules/' \
            --exclude 'data/' --exclude '.env' --exclude '.deploy-tools/' \
            ./ "cloudpanel:$DEPLOY_PATH/"

      - name: Restart app
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_PORT: ${{ secrets.APP_PORT || '3087' }}
        run: |
          ssh cloudpanel "DEPLOY_PATH='$DEPLOY_PATH' APP_PORT='$APP_PORT' bash -s" <<'REMOTE'
          set -e
          cd "$DEPLOY_PATH"

          # Find Node 24. CloudPanel installs it with nvm in the site owner's home, which a
          # non-interactive SSH session doesn't load. If none is visible to this user, download
          # an official Node 24 build into the site (no root needed).
          TOOLS="$DEPLOY_PATH/.deploy-tools"
          OWNER_HOME="$(echo "$DEPLOY_PATH" | sed -E 's#^(/home/[^/]+).*#\1#')"
          find_node() {
            for bin in "$TOOLS/node/bin" \
                $(ls -d "$HOME"/.nvm/versions/node/v24*/bin "$OWNER_HOME"/.nvm/versions/node/v24*/bin \
                        /home/*/.nvm/versions/node/v24*/bin /usr/local/nvm/versions/node/v24*/bin 2>/dev/null | sort -rV) \
                /usr/local/bin /usr/bin; do
              if [ -x "$bin/node" ] && "$bin/node" -v 2>/dev/null | grep -q '^v24'; then echo "$bin"; return 0; fi
            done
            return 1
          }
          if ! NODE_BIN="$(find_node)"; then
            case "$(uname -m)" in x86_64) ARCH=x64 ;; aarch64|arm64) ARCH=arm64 ;; *) echo "::error::Unsupported CPU $(uname -m)"; exit 1 ;; esac
            BASE=https://nodejs.org/dist/latest-v24.x
            FILE="$(curl -fsSL "$BASE/SHASUMS256.txt" | grep -o "node-v24[^ ]*-linux-$ARCH.tar.xz" | head -n1)"
            echo "No Node 24 visible to $(whoami); installing $FILE into $TOOLS/node"
            mkdir -p "$TOOLS"
            curl -fsSL "$BASE/$FILE" -o "$TOOLS/node.tar.xz"
            curl -fsSL "$BASE/SHASUMS256.txt" | grep " $FILE\$" | sed "s# $FILE# $TOOLS/node.tar.xz#" | sha256sum -c -
            rm -rf "$TOOLS/node" && mkdir -p "$TOOLS/node"
            tar -xJf "$TOOLS/node.tar.xz" -C "$TOOLS/node" --strip-components=1
            rm -f "$TOOLS/node.tar.xz"
            NODE_BIN="$(find_node)"
          fi
          export PATH="$NODE_BIN:$PATH"
          echo "Using Node $(node -v) from $NODE_BIN as $(whoami)"

          # PM2 lives inside the site so we never need write access to a global npm prefix.
          if [ ! -x "$TOOLS/node_modules/.bin/pm2" ]; then
            npm install --silent --no-audit --no-fund --prefix "$TOOLS" pm2@6
          fi
          export PATH="$TOOLS/node_modules/.bin:$PATH"

          mkdir -p data
          PORT="$APP_PORT" pm2 startOrReload ecosystem.config.cjs --update-env
          pm2 save
          REMOTE

      - name: Health check
        env:
          APP_PORT: ${{ secrets.APP_PORT || '3087' }}
        run: |
          for i in 1 2 3 4 5; do
            if ssh cloudpanel "curl -fsS http://127.0.0.1:$APP_PORT/api/leaderboard?limit=1" ; then exit 0; fi
            sleep 3
          done
          echo "::error::App did not respond on port $APP_PORT"
          exit 1

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
